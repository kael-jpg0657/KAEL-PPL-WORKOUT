// ══════════════════════════════════════════════════════════════════
// AI INSIGHTS — Plateau Detector + Note Pattern Flag (local, rule-based)
// ══════════════════════════════════════════════════════════════════

function getAiInsights(sessions) {
  const insights = [];

  // Build per-exercise history: name -> [{date, effKg, note}]
  const exHist = {};
  sessions.forEach(([date, data]) => {
    (data.exercises || []).forEach(ex => {
      if (!exHist[ex.name]) exHist[ex.name] = [];
      // Effective weight: highest actual kg logged this session
      let effKg = null;
      if (ex.actualSets && ex.actualSets.length) {
        const loggedKgs = ex.actualSets.map(s => s.kg).filter(k => k != null);
        if (loggedKgs.length) effKg = Math.max(...loggedKgs);
      }
      exHist[ex.name].push({ date, effKg, note: (ex.note || '').trim().toLowerCase() });
    });
  });

  // ── 1. PLATEAU DETECTOR ──
  Object.keys(exHist).forEach(name => {
    const hist = exHist[name].filter(h => h.effKg != null);
    if (hist.length < 2) return;
    const last2 = hist.slice(-2);
    const allSame2 = last2.every(h => h.effKg === last2[0].effKg);
    const allSame3 = hist.length >= 3 && hist.slice(-3).every(h => h.effKg === hist.slice(-3)[0].effKg);
    if (allSame3) {
      insights.push({
        level: 'warn',
        icon: '🔴',
        title: `Plateau: ${name}`,
        message: `You've been stuck at ${last2[0].effKg}kg for 3+ sessions. Time to increase the weight, add a set, or change the tempo.`,
      });
    } else if (allSame2) {
      insights.push({
        level: 'caution',
        icon: '🟡',
        title: `Watch: ${name}`,
        message: `Same weight (${last2[0].effKg}kg) for the last 2 sessions. Once you can hit max reps on every set next time, bump the weight up.`,
      });
    }
  });

  // ── 2. NOTE PATTERN FLAG (injury/discomfort watch) ──
  Object.keys(exHist).forEach(name => {
    const notes = exHist[name].filter(h => h.note).slice(-6); // last 6 notes
    if (notes.length < 1) return;
    const painWords = ['sakit','masakit','pain','hirap','mahirap','pananakit','pigsa','pilay','inju','sprain'];
    const flagged = notes.filter(n => painWords.some(w => n.note.includes(w)));
    if (flagged.length >= 1) {
      insights.push({
        level: flagged.length >= 2 ? 'warn' : 'caution',
        icon: '⚠️',
        title: `Note flag: ${name}`,
        message: flagged.length >= 2
          ? `You've mentioned discomfort/pain on this exercise ${flagged.length} times. It might be worth checking your form, lowering the weight, or resting it for a bit.`
          : `You mentioned discomfort/pain on this exercise. Keep an eye on it next session.`,
      });
    }
  });

  // ── 3. CONSISTENCY PATTERN (skip pattern by weekday) ──
  const dayStatusEntries = Object.entries(S.dayStatus || {}).filter(([,v]) => v.status === 'skip');
  if (dayStatusEntries.length >= 2) {
    const dowCounts = [0,0,0,0,0,0,0];
    dayStatusEntries.forEach(([iso]) => { dowCounts[fromISO(iso).getDay()]++; });
    const maxCount = Math.max(...dowCounts);
    const maxDow = dowCounts.indexOf(maxCount);
    if (maxCount >= 2) {
      const dowNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      insights.push({
        level: 'caution',
        icon: '📅',
        title: 'Skip Pattern Detected',
        message: `You've skipped your workout ${maxCount} times on ${dowNames[maxDow]}s. Might be worth a different schedule or an earlier time that day.`,
      });
    }
  }

  return insights;
}

function renderProgress() {
  const wrap = document.getElementById('prog-wrap');
  const sessions = Object.entries(S.completedSessions).sort((a,b)=>a[0].localeCompare(b[0]));
  const filtered = progFilter === 'all' ? sessions : sessions.filter(([,d])=>d.type===progFilter);

  if (sessions.length < 2) {
    wrap.innerHTML = `<div class="prog-empty">Complete at least 2 sessions to see your progression.<br><br>💪 Keep going!</div>`;
    return;
  }

  // ── Overview cards (volume derived from actual logged kg × logged reps) ──
  function sessionVolume(d) {
    return (d.exercises||[]).reduce((acc,e)=>{
      if (!e.actualSets) return acc;
      e.actualSets.forEach(a=>{ if (a.kg!=null && a.reps!=null) acc += a.kg*a.reps; });
      return acc;
    },0);
  }
  const lastWeek = sessions.filter(([dt])=>{ const d=fromISO(dt); const now=new Date(); const diff=(now-d)/864e5; return diff<=7; });
  const prevWeek = sessions.filter(([dt])=>{ const d=fromISO(dt); const now=new Date(); const diff=(now-d)/864e5; return diff>7&&diff<=14; });
  const lwVol = lastWeek.reduce((acc,[,d])=>acc+sessionVolume(d),0);
  const pwVol = prevWeek.reduce((acc,[,d])=>acc+sessionVolume(d),0);
  const volChange = pwVol > 0 ? Math.round((lwVol-pwVol)/pwVol*100) : null;
  const streak = S.streak || 0;
  const totalSessions = sessions.length;

  let html = `<div class="prog-overview">
    <div class="prog-ov-card">
      <div class="prog-ov-title">Total Sessions</div>
      <div class="prog-ov-val">${totalSessions}</div>
      <div class="prog-ov-sub">since Week 1</div>
    </div>
    <div class="prog-ov-card">
      <div class="prog-ov-title">Current Streak</div>
      <div class="prog-ov-val">${streak}</div>
      <div class="prog-ov-sub">days in a row 🔥</div>
    </div>
    <div class="prog-ov-card">
      <div class="prog-ov-title">This Week Volume</div>
      <div class="prog-ov-val">${Math.round(lwVol).toLocaleString()}</div>
      <div class="prog-ov-sub">kg lifted (logged)</div>
    </div>
    <div class="prog-ov-card">
      <div class="prog-ov-title">vs Last Week</div>
      <div class="prog-ov-val" style="color:${volChange===null?'var(--sub)':volChange>=0?'var(--legs)':'var(--push)'}">${volChange===null?'—':(volChange>=0?'+':'')+volChange+'%'}</div>
      <div class="prog-ov-sub">${volChange===null?'need more data':volChange>0?'Progressive Overload! 🔥':volChange===0?'Same volume':'Volume dropped'}</div>
    </div>
  </div>`;

  // ── AI Insights (Plateau Detector + Note Pattern Flag) ──
  const insights = getAiInsights(sessions);
  html += `<div class="prog-section"><div class="prog-section-title">🤖 AI Insights</div>`;
  if (insights.length) {
    insights.forEach(ins => {
      html += `<div class="insight-card ${ins.level}">
        <div class="insight-icon">${ins.icon}</div>
        <div class="insight-body">
          <div class="insight-title">${ins.title}</div>
          <div class="insight-msg">${ins.message}</div>
        </div>
      </div>`;
    });
  } else {
    html += `<div class="insight-card">
      <div class="insight-icon">✅</div>
      <div class="insight-body">
        <div class="insight-title">No issues detected</div>
        <div class="insight-msg">No plateau, recurring pain notes, or skip pattern detected yet. Needs a few more sessions before insights show up — just keep logging.</div>
      </div>
    </div>`;
  }
  html += `</div>`;

  // ── Filter buttons ──
  html += `<div class="prog-filter">
    <button class="prog-filter-btn ${progFilter==='all'?'active':''}" onclick="setProgFilter('all')">All</button>
    <button class="prog-filter-btn ${progFilter==='push'?'active':''}" onclick="setProgFilter('push')">Push</button>
    <button class="prog-filter-btn ${progFilter==='pull'?'active':''}" onclick="setProgFilter('pull')">Pull</button>
    <button class="prog-filter-btn ${progFilter==='legs'?'active':''}" onclick="setProgFilter('legs')">Legs</button>
    <button class="prog-filter-btn ${progFilter==='fullbody'?'active':''}" onclick="setProgFilter('fullbody')">Full Body</button>
  </div>`;

  // ── Per-exercise progression (based on ACTUAL logged kg/reps, not planned) ──
  const exMap = {}; // exName -> [{date, kg, reps, isBW, vol, type}]
  filtered.forEach(([date, data]) => {
    (data.exercises||[]).forEach(ex => {
      if (!exMap[ex.name]) exMap[ex.name] = [];
      const loggedKgs = (ex.actualSets||[]).map(s=>s.kg).filter(k=>k!=null);
      const loggedReps = (ex.actualSets||[]).map(s=>s.reps).filter(r=>r!=null);
      const maxKg = loggedKgs.length ? Math.max(...loggedKgs) : null;
      const maxReps = loggedReps.length ? Math.max(...loggedReps) : null;
      const isBW = maxKg == null;
      let vol = 0;
      (ex.actualSets||[]).forEach(a=>{ if (a.kg!=null && a.reps!=null) vol += a.kg*a.reps; });
      exMap[ex.name].push({ date, kg: maxKg||0, isBW, sets: ex.sets, repsLo: ex.repsLo, repsHi: ex.repsHi, vol, type: data.type, repsLogged: maxReps });
    });
  });

  const exNames = Object.keys(exMap).filter(n => exMap[n].length >= 1);
  if (!exNames.length) {
    html += `<div class="prog-empty">No data yet for ${progFilter} sessions.</div>`;
    wrap.innerHTML = html;
    return;
  }

  html += `<div class="prog-section"><div class="prog-section-title">Exercise Progression</div>`;

  exNames.forEach(name => {
    const entries = exMap[name].slice(-8); // last 8 sessions with this exercise
    const type = entries[0].type;
    const isBW = entries[0].isBW;
    const last = entries[entries.length-1];
    const first = entries[0];

    if (isBW) {
      // ── BODYWEIGHT EXERCISE CARD (track reps/sets, no weight) ──
      const maxReps = Math.max(...entries.map(e => e.repsLogged || e.repsHi || 1));
      const bars = entries.map(e => {
        const repVal = e.repsLogged || e.repsHi;
        const pct = maxReps > 0 ? Math.max(8, Math.round(repVal / maxReps * 100)) : 8;
        return `<div class="prog-bar-wrap">
          <div class="prog-bar-val">${e.repsLogged ? e.repsLogged+'r' : (e.repsHi?'~'+e.repsHi+'r':'—')}</div>
          <div class="prog-bar ${type}" style="height:${pct}%" title="${e.date}: ${e.sets} sets"></div>
          <div class="prog-bar-lbl">${e.date.slice(5)}</div>
        </div>`;
      }).join('');

      const repChange = (last.repsLogged || 0) - (first.repsLogged || 0);
      let trendText = '', trendClass = 'same';
      if (last.repsLogged == null) { trendText = `Log your actual reps in the set inputs to see progression here.`; trendClass = 'same'; }
      else if (repChange > 0) { trendText = `+${repChange} reps vs your first session! 🔥 You're getting stronger.`; trendClass = 'up'; }
      else if (repChange < 0) { trendText = `Down ${Math.abs(repChange)} reps. Could be fatigue or needing more rest — that's okay.`; trendClass = 'down'; }
      else if (entries.length === 1) { trendText = `Just your first session — log one more to see the trend.`; trendClass = 'same'; }
      else { trendText = `Your reps are consistent. Once you can beat ${last.repsHi||'target'} reps, add a set or make the variation harder.`; trendClass = 'same'; }

      html += `<div class="prog-card">
        <div class="prog-card-name">${name} <span style="font-weight:400;color:var(--sub);font-size:.75rem">(${entries.length} sessions · bodyweight)</span></div>
        <div class="prog-chart" style="align-items:flex-end">${bars}</div>
        <div class="prog-summary">
          <div class="prog-stat">
            <div class="prog-stat-val ${repChange>0?'up':repChange<0?'down':'same'}">${last.repsLogged || last.repsHi || '—'}</div>
            <div class="prog-stat-lbl">Reps</div>
          </div>
          <div class="prog-stat">
            <div class="prog-stat-val ${repChange>0?'up':repChange<0?'down':'same'}">${repChange>0?'+':''}${last.repsLogged!=null&&first.repsLogged!=null?repChange:'—'}</div>
            <div class="prog-stat-lbl">Reps Δ</div>
          </div>
          <div class="prog-stat">
            <div class="prog-stat-val">${last.sets}</div>
            <div class="prog-stat-lbl">Sets</div>
          </div>
          <div class="prog-stat">
            <div class="prog-stat-val">${last.repsLo||'—'}-${last.repsHi||'—'}</div>
            <div class="prog-stat-lbl">Target</div>
          </div>
        </div>
        <div class="prog-trend ${trendClass}">${trendText}</div>
      </div>`;
      return;
    }

    // ── WEIGHTED EXERCISE CARD ──
    const maxVol = Math.max(...entries.map(e=>e.vol), 1);
    const kgChange = last.kg - first.kg;
    const volChange = entries.length > 1 ? last.vol - entries[entries.length-2].vol : 0;
    const isUp = kgChange > 0 || (kgChange === 0 && volChange > 0);
    const isDown = kgChange < 0 || (kgChange === 0 && volChange < 0);

    const bars = entries.map((e, i) => {
      const pct = maxVol > 0 ? Math.max(8, Math.round(e.vol / maxVol * 100)) : 8;
      const isUp2 = i > 0 && e.vol > entries[i-1].vol;
      return `<div class="prog-bar-wrap">
        <div class="prog-bar-val">${e.kg}kg</div>
        <div class="prog-bar ${type} ${isUp2?'up':''}" style="height:${pct}%" title="${e.date}: ${e.kg}kg × ${e.sets}sets"></div>
        <div class="prog-bar-lbl">${e.date.slice(5)}</div>
      </div>`;
    }).join('');

    let trendText = '', trendClass = 'same';
    if (kgChange > 0) { trendText = `+${kgChange}kg vs your first session! 🔥 Progressive overload confirmed.`; trendClass = 'up'; }
    else if (kgChange < 0) { trendText = `Weight dropped by ${Math.abs(kgChange)}kg. Could be a deload week or injury prevention — that's okay.`; trendClass = 'down'; }
    else if (volChange > 0) { trendText = `Same weight but volume went up (+${Math.round(volChange)}kg vol). Volume progression still counts as overload! 💪`; trendClass = 'up'; }
    else if (volChange < 0) { trendText = `Same weight, volume dropped. Try adding 1 more set next session.`; trendClass = 'down'; }
    else if (entries.length === 1) { trendText = `Just your first session — log one more to see the trend.`; trendClass = 'same'; }
    else { trendText = `Weight and volume are steady. You're in charge of when to increase — you set the weight every week.`; trendClass = 'same'; }

    html += `<div class="prog-card">
      <div class="prog-card-name">${name} <span style="font-weight:400;color:var(--sub);font-size:.75rem">(${entries.length} sessions)</span></div>
      <div class="prog-chart" style="align-items:flex-end">${bars}</div>
      <div class="prog-summary">
        <div class="prog-stat">
          <div class="prog-stat-val ${isUp?'up':isDown?'down':'same'}">${last.kg}kg</div>
          <div class="prog-stat-lbl">Current</div>
        </div>
        <div class="prog-stat">
          <div class="prog-stat-val ${kgChange>0?'up':kgChange<0?'down':'same'}">${kgChange>0?'+':''}${kgChange}kg</div>
          <div class="prog-stat-lbl">Weight Δ</div>
        </div>
        <div class="prog-stat">
          <div class="prog-stat-val">${last.sets}</div>
          <div class="prog-stat-lbl">Sets</div>
        </div>
        <div class="prog-stat">
          <div class="prog-stat-val ${volChange>0?'up':volChange<0?'down':'same'}">${Math.round(last.vol)}</div>
          <div class="prog-stat-lbl">Volume</div>
        </div>
      </div>
      <div class="prog-trend ${trendClass}">${trendText}</div>
    </div>`;
  });

  html += `</div>`;

  // ── Recent sessions list ──
  html += `<div class="prog-section"><div class="prog-section-title">Recent Sessions</div>`;
  const recent = filtered.slice(-10).reverse();
  recent.forEach(([date, data]) => {
    const vol = sessionVolume(data);
    html += `<div class="prog-week-row">
      <div class="prog-week-dot ${data.type}"></div>
      <div style="flex:1;color:var(--text);font-weight:600">${data.type?.toUpperCase()} · ${date}</div>
      <div style="color:var(--sub);font-size:.7rem">${data.totalSets||0} sets · ${Math.round(vol).toLocaleString()}kg vol</div>
    </div>`;
  });
  html += `</div>`;

  wrap.innerHTML = html;
}

function setProgFilter(f) {
  progFilter = f;
  renderProgress();
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('pane-workout').style.display = tab === 'workout' ? '' : 'none';
  document.getElementById('pane-challenge').style.display = tab === 'challenge' ? '' : 'none';
  document.getElementById('pane-history').style.display = tab === 'history' ? '' : 'none';
  document.getElementById('pane-progress').style.display = tab === 'progress' ? '' : 'none';
  document.getElementById('tab-workout').classList.toggle('active', tab === 'workout');
  document.getElementById('tab-challenge').classList.toggle('active', tab === 'challenge');
  document.getElementById('tab-history').classList.toggle('active', tab === 'history');
  document.getElementById('tab-progress').classList.toggle('active', tab === 'progress');
  if (tab === 'challenge') renderChallenges();
  if (tab === 'history') renderHistory();
  if (tab === 'progress') renderProgress();
}

function changeMonth(dir) {
  S.viewMonth += dir;
  if (S.viewMonth < 0)  { S.viewMonth = 11; S.viewYear--; }
  if (S.viewMonth > 11) { S.viewMonth = 0;  S.viewYear++; }
  save(); renderHeader(); renderCalendar();
}

function selectDate(iso) {
  S.selectedDate = iso; save(); renderCalendar(); renderSession(); renderStats();
}

function toggleWu() {
  const k = `wu-${S.selectedDate}`;
  S.expanded[k] = !S.expanded[k]; save(); renderSession();
}

function toggleEx(ei) {
  const k = `ex-${S.selectedDate}-${ei}`;
  S.expanded[k] = !S.expanded[k]; save(); renderSession();
}

function toggleHistItem(date) {
  const k = `hist-${date}`;
  S.expanded[k] = !S.expanded[k]; save(); renderHistory();
}

function toggleSet(sk) {
  S.setChecks[sk] = !S.setChecks[sk]; save();

  const parts = sk.split('-');
  const si = parseInt(parts.pop());
  const ei = parseInt(parts.pop());
  const dateISO = parts.join('-');

  const type = getActiveDayType(dateISO);
  const exs = getExercises(type);
  const week = getWeekNumber(dateISO);
  const {sets, repsLo, repsHi} = getSessionParams(type, week);

  // Update button + row
  const btn = document.getElementById(`sb-${sk}`);
  const row = document.getElementById(`sr-${sk}`);
  if (btn) btn.classList.toggle('done', !!S.setChecks[sk]);
  if (row) row.classList.toggle('done', !!S.setChecks[sk]);

  // Exercise done?
  const exSetCountTS = getExSets(type, ei, sets);
  let exDone = true;
  for (let s=0;s<exSetCountTS;s++) { if (!S.setChecks[`${dateISO}-${ei}-${s}`]) { exDone = false; break; } }
  const card = document.getElementById(`exc-${dateISO}-${ei}`);
  if (card) {
    card.classList.toggle('done', exDone);
    const nm = card.querySelector('.ex-name');
    const nameOvTS = (S.weightOverrides && S.weightOverrides[type+'|name|'+ei]) || exs[ei].name;
    if (nm) nm.textContent = nameOvTS + (exDone ? ' ✓' : '');
  }

  // Total
  let totalSets = 0;
  let doneSets = 0;
  const hiddenSetTS = new Set((S.hiddenBaseEx && S.hiddenBaseEx[type]) || []);
  exs.forEach((_,i2) => { if (hiddenSetTS.has(i2)) return; const sc = getExSets(type, i2, sets); totalSets += sc; for (let s=0;s<sc;s++) { if (S.setChecks[`${dateISO}-${i2}-${s}`]) doneSets++; } });
  const pct = Math.round(doneSets/totalSets*100);
  const pf = document.getElementById('prog-fill');
  if (pf) pf.style.width = pct + '%';
  document.querySelectorAll('.htag').forEach(t => { if (t.textContent.includes('done') && !t.textContent.includes('COMPLETE')) t.textContent = `${doneSets}/${totalSets} done`; });

  renderStats();

  if (S.setChecks[sk]) {
    toast('Set done! 💪');
    const allDone = doneSets === totalSets;
    if (!allDone) startTimer(exs[ei].restSec || getPhase(week).restSec || 90);
    const fb = document.getElementById('finish-btn');
    if (fb) fb.classList.toggle('vis', allDone);
    if (allDone) toast('🎉 All sets done! Tap the SAVE button.');
  }
}

function completeSession() {
  const type = getActiveDayType(S.selectedDate);
  const exs = getExercises(type);
  const week = getWeekNumber(S.selectedDate);
  const params = getSessionParams(type, week);
  const hiddenSetCS = new Set((S.hiddenBaseEx && S.hiddenBaseEx[type]) || []);
  const visibleExs = exs.map((ex,ei)=>({ex,ei})).filter(o=>!hiddenSetCS.has(o.ei));

  const sessionData = {
    type,
    week,
    phase: params.phase,
    totalSets: visibleExs.reduce((acc,{ei})=>acc+getExSets(type,ei,params.sets),0),
    exercises: visibleExs.map(({ex,ei}) => {
      const nameOv = (S.weightOverrides && S.weightOverrides[type+'|name|'+ei]) || ex.name;
      const setCount = getExSets(type, ei, params.sets);
      const actualSets = [];
      for (let s=0; s<setCount; s++) {
        const sk = `${S.selectedDate}-${ei}-${s}`;
        const log = (S.actualLogs && S.actualLogs[sk]) || {};
        actualSets.push({ kg: log.kg != null ? log.kg : null, reps: log.reps != null ? log.reps : null });
      }
      const noteKey = `${S.selectedDate}-${ei}`;
      return {
        name: nameOv,
        kg: actualSets.find(a=>a.kg!=null)?.kg ?? null,
        sets: setCount,
        repsLo: params.repsLo,
        repsHi: params.repsHi,
        actualSets,
        note: (S.exerciseNotes && S.exerciseNotes[noteKey]) || '',
      };
    }),
    completedAt: new Date().toISOString(),
  };

  S.completedSessions[S.selectedDate] = sessionData;
  S.streak = (S.streak || 0) + 1;
  save();
  toast('✅ Session saved! Magpahinga ka. 🙌');
  renderCalendar();
  renderSession();
  renderStats();
}

let pendingDeleteHistoryDate = null;
let pendingDeleteHistoryTimer = null;

function deleteHistoryEntry(date, ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  if (!S.completedSessions[date]) return;

  if (pendingDeleteHistoryDate !== date) {
    pendingDeleteHistoryDate = date;
    clearTimeout(pendingDeleteHistoryTimer);
    pendingDeleteHistoryTimer = setTimeout(() => { pendingDeleteHistoryDate = null; renderHistory(); }, 3000);
    toast('⚠️ Tap again to delete this session');
    renderHistory();
    return;
  }

  clearTimeout(pendingDeleteHistoryTimer);
  pendingDeleteHistoryDate = null;
  delete S.completedSessions[date];
  save();
  toast('🗑 Session deleted.');
  renderHistory();
  renderCalendar();
  renderStats();
}

let pendingClearHistory = false;
let pendingClearHistoryTimer = null;

function clearHistory() {
  if (!pendingClearHistory) {
    pendingClearHistory = true;
    clearTimeout(pendingClearHistoryTimer);
    pendingClearHistoryTimer = setTimeout(() => { pendingClearHistory = false; renderHistory(); }, 3000);
    toast('⚠️ I-tap ulit para i-clear ANG LAHAT ng history');
    renderHistory();
    return;
  }
  clearTimeout(pendingClearHistoryTimer);
  pendingClearHistory = false;
  S.completedSessions = {};
  S.setChecks = {};
  S.streak = 0;
  save(); renderHistory(); renderStats(); renderCalendar();
}

// ══════════════════════════════════════════════════════════════════

// When Set 1's kg or reps is entered, auto-fill the same value into every
// other set of that exercise (still editable individually afterward).
function saveActualLog(sk, field, val) {
  if (!S.actualLogs) S.actualLogs = {};
  if (!S.actualLogs[sk]) S.actualLogs[sk] = {};
  const num = parseFloat(val);
  const valid = !isNaN(num) && num >= 0;
  if (valid) {
    S.actualLogs[sk][field] = num;
  } else {
    delete S.actualLogs[sk][field];
    if (Object.keys(S.actualLogs[sk]).length === 0) delete S.actualLogs[sk];
  }
  save();

  // Parse sk = "YYYY-MM-DD-ei-si"
  const parts = sk.split('-');
  const si = parseInt(parts.pop());
  const ei = parseInt(parts.pop());
  const dateISO = parts.join('-');

  // Only Set 1 (si === 0) auto-fills the rest
  if (si !== 0) return;

  const type = getActiveDayType(dateISO);
  const week = getWeekNumber(dateISO);
  const { sets } = getSessionParams(type, week);
  const exSetCount = getExSets(type, ei, sets);

  for (let s = 1; s < exSetCount; s++) {
    const otherSk = `${dateISO}-${ei}-${s}`;
    if (!S.actualLogs) S.actualLogs = {};
    if (!S.actualLogs[otherSk]) S.actualLogs[otherSk] = {};
    if (valid) S.actualLogs[otherSk][field] = num;
    else delete S.actualLogs[otherSk][field];
    if (Object.keys(S.actualLogs[otherSk]).length === 0) delete S.actualLogs[otherSk];

    const inputId = field === 'kg' ? `alk-${otherSk}` : `alr-${otherSk}`;
    const el = document.getElementById(inputId);
    if (el) el.value = valid ? num : '';
  }
  save();
}

function saveExerciseNote(type, ei, val) {
  if (!S.exerciseNotes) S.exerciseNotes = {};
  const noteKey = `${S.selectedDate}-${ei}`;
  const v = val.trim();
  if (v) S.exerciseNotes[noteKey] = v;
  else delete S.exerciseNotes[noteKey];
  save();
}

function saveExName(type, ei, val) {
  if (!S.weightOverrides) S.weightOverrides = {};
  const v = val.trim();
  if (v) S.weightOverrides[type + '|name|' + ei] = v;
  else delete S.weightOverrides[type + '|name|' + ei];
  save();
  // Just update the displayed name in header without full re-render
  const card = document.getElementById(`exc-${S.selectedDate}-${ei}`);
  if (card) {
    const nm = card.querySelector('.ex-name');
    const exDone = card.classList.contains('done');
    if (nm) nm.textContent = (v || getExercises(type)[ei].name) + (exDone ? ' ✓' : '');
  }
}

function addExtraSet(type, ei) {
  if (!S.extraSets) S.extraSets = {};
  if (!S.actualLogs) S.actualLogs = {};
  if (!S.exerciseNotes) S.exerciseNotes = {};
  const key = type + '|' + ei;
  S.extraSets[key] = (S.extraSets[key] || 0) + 1;
  save();
  renderSession();
  renderStats();
  toast('Set added! 💪');
}

function removeExtraSet(type, ei) {
  if (!S.extraSets) S.extraSets = {};
  if (!S.actualLogs) S.actualLogs = {};
  if (!S.exerciseNotes) S.exerciseNotes = {};
  const key = type + '|' + ei;
  if (!S.extraSets[key] || S.extraSets[key] <= 0) return;
  // Uncheck the last set's checkbox before removing
  const week = getWeekNumber(S.selectedDate);
  const baseSets = getSessionParams(type, week).sets;
  const total = baseSets + S.extraSets[key];
  const lastSk = `${S.selectedDate}-${ei}-${total - 1}`;
  delete S.setChecks[lastSk];
  S.extraSets[key]--;
  if (S.extraSets[key] === 0) delete S.extraSets[key];
  save();
  renderSession();
  renderStats();
}

function toggleAddForm(type) {
  S.showAddForm = S.showAddForm === type ? null : type;
  save();
  renderSession();
  if (type) {
    setTimeout(() => {
      const el = document.getElementById('aef-name');
      if (el) el.focus();
    }, 100);
  }
}

function saveNewExercise(type) {
  const name = document.getElementById('aef-name')?.value?.trim();
  if (!name) { toast('Please enter an exercise name!'); return; }
  const guide = document.getElementById('aef-guide')?.value?.trim() || 'Perform with proper form and full range of motion.';
  const kgVal = parseFloat(document.getElementById('aef-kg')?.value);
  const restVal = parseInt(document.getElementById('aef-rest')?.value) || 60;
  const baseKg = (!isNaN(kgVal) && kgVal > 0) ? kgVal : null;
  const cat = baseKg ? 'isolation' : 'bodyweight';

  if (!S.customExercises) S.customExercises = {};
  if (!S.customExercises[type]) S.customExercises[type] = [];
  S.customExercises[type].push({ name, guide, baseKg, cat, restSec: restVal });

let pendingDeleteExKey = null;
let pendingDeleteExTimer = null;

function deleteExercise(type, ei, isCustom) {
  const exs = getExercises(type);
  const ex = exs[ei];
  if (!ex) return;
  const key = type + '|' + ei;
  const nameOv = (S.weightOverrides && S.weightOverrides[type+'|name|'+ei]) || ex.name;

  if (pendingDeleteExKey !== key) {
    // First tap — arm the confirmation (no window.confirm, which can be
    // blocked/no-op in sandboxed preview contexts)
    pendingDeleteExKey = key;
    clearTimeout(pendingDeleteExTimer);
    pendingDeleteExTimer = setTimeout(() => { pendingDeleteExKey = null; renderSession(); }, 3000);
    toast(`Tap again to delete "${nameOv}"`);
    renderSession();
    return;
  }

  // Second tap within the window — actually delete
  clearTimeout(pendingDeleteExTimer);
  pendingDeleteExKey = null;

  if (isCustom) {
    const baseCount = getBaseArr(type).length;
    const customIdx = ei - baseCount;
    if (customIdx >= 0 && S.customExercises && S.customExercises[type]) {
      S.customExercises[type].splice(customIdx, 1);
      if (!S.weightOverrides) S.weightOverrides = {};
      delete S.weightOverrides[type + '|name|' + ei];
    }
  } else {
    if (!S.hiddenBaseEx) S.hiddenBaseEx = {};
    if (!S.hiddenBaseEx[type]) S.hiddenBaseEx[type] = [];
    if (!S.hiddenBaseEx[type].includes(ei)) S.hiddenBaseEx[type].push(ei);
  }
  save();
  renderSession();
  renderStats();
  toast(`Deleted "${nameOv}".`);
}

function restoreBaseEx(type, ei) {
  if (!S.hiddenBaseEx || !S.hiddenBaseEx[type]) return;
  S.hiddenBaseEx[type] = S.hiddenBaseEx[type].filter(i => i !== ei);
  save();
  renderSession();
  renderStats();
  toast('Exercise restored.');
}

function renderChallenges() {
  const wrap = document.getElementById('chal-wrap');
  const ids = Object.keys(S.challenges || {});

  let html = '';

  if (!ids.length) {
    html += `<div class="chal-empty">You don't have a challenge yet.<br>Create one — e.g. Push-Up Challenge — to track your progressive overload over time. 🎯</div>`;
  } else {
    ids.sort((a,b)=> (S.challenges[a].createdAt||'').localeCompare(S.challenges[b].createdAt||'')).forEach(id => {
      const c = S.challenges[id];
      const logEntries = Object.entries(c.logs || {}).sort((a,b)=>a[0].localeCompare(b[0]));
      const todayVal = (c.logs && c.logs[todayISO()] != null) ? c.logs[todayISO()] : '';
      const best = logEntries.length ? Math.max(...logEntries.map(([,v])=>v)) : null;
      const first = logEntries.length ? logEntries[0][1] : null;
      const last = logEntries.length ? logEntries[logEntries.length-1][1] : null;
      const change = (first!=null && last!=null) ? last - first : null;
      const isOpen = !!S.chalExpanded[id];

      const barsSrc = logEntries.slice(-10);
      const maxVal = barsSrc.length ? Math.max(...barsSrc.map(([,v])=>v), 1) : 1;
      const bars = barsSrc.map(([date,val]) => {
        const pct = Math.max(8, Math.round(val/maxVal*100));
        return `<div class="prog-bar-wrap">
          <div class="prog-bar-val">${val}${c.unit||''}</div>
          <div class="prog-bar challenge" style="height:${pct}%" title="${date}: ${val}${c.unit||''}"></div>
          <div class="prog-bar-lbl">${date.slice(5)}</div>
        </div>`;
      }).join('');

      html += `
      <div class="chal-card">
        <div class="chal-hdr">
          <div class="chal-name">${c.name}</div>
          <button class="chal-del ${pendingDeleteChallengeId===id?'confirming':''}" onclick="deleteChallenge('${id}')">${pendingDeleteChallengeId===id?'✓':'🗑'}</button>
        </div>
        <div class="chal-sub">${c.target ? `Goal: ${c.target}${c.unit||''}` : 'Progressive overload tracker'} · ${logEntries.length} logs</div>

        <div class="chal-today-row">
          <div class="chal-today-field">
            <label>Log today (${c.unit||'value'})</label>
            <input type="number" step="0.5" min="0" id="chal-input-${id}" value="${todayVal}" placeholder="0">
          </div>
          <button class="chal-log-btn" onclick="logChallenge('${id}')">+ LOG</button>
        </div>

        ${logEntries.length ? `<div class="prog-chart" style="align-items:flex-end">${bars}</div>` : ''}

        <div class="chal-stats">
          <div class="chal-stat"><div class="chal-stat-val">${last ?? '—'}</div><div class="chal-stat-lbl">Latest</div></div>
          <div class="chal-stat"><div class="chal-stat-val">${best ?? '—'}</div><div class="chal-stat-lbl">Best</div></div>
          <div class="chal-stat"><div class="chal-stat-val" style="color:${change>0?'var(--legs)':change<0?'var(--push)':'var(--sub)'}">${change==null?'—':(change>0?'+':'')+change}</div><div class="chal-stat-lbl">Since Day 1</div></div>
        </div>

        ${c.target && last!=null ? `<div class="chal-goal-note">🎯 ${last >= c.target ? `You've hit your goal of ${c.target}${c.unit||''}! Time to set a new one.` : `${(c.target-last).toFixed(1)}${c.unit||''} to go to reach your goal of ${c.target}${c.unit||''}.`}</div>` : ''}

        ${logEntries.length ? `<button class="chal-toggle-log" onclick="toggleChalLog('${id}')">${isOpen?'Hide':'View'} full log (${logEntries.length})</button>` : ''}
        <div class="chal-log-list ${isOpen?'open':''}">
          ${logEntries.slice().reverse().map(([date,val])=>`<div class="chal-log-item"><span>${date}</span><span>${val}${c.unit||''}</span></div>`).join('')}
        </div>
      </div>`;
    });
  }

  const showForm = !!S.showAddChallenge;
  html += `<button class="chal-new-btn" onclick="toggleAddChallenge()">+ Create New Challenge</button>`;
  if (showForm) {
    html += `
    <div class="chal-new-form">
      <label>Challenge Name</label>
      <input type="text" id="cnf-name" placeholder="e.g. Push-Up Challenge, Plank Challenge...">
      <div class="chal-new-row">
        <div><label>Unit</label>
          <select id="cnf-unit">
            <option value=" reps">reps</option>
            <option value="s">seconds</option>
            <option value="kg">kg</option>
            <option value=" min">minutes</option>

        <button class="chal-new-save" onclick="saveNewChallenge()">SAVE</button>
      </div>
    </div>`;
  }

  wrap.innerHTML = html;

// ══════════════════════════════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════════════════════════════
const CIRC = 2 * Math.PI * 88;
let timerIv = null, timerTotal = 90, timerLeft = 90, activePreset = 90;

function timerColor(r) { return r > .5 ? '#4ee88a' : r > .25 ? '#f5c518' : '#ff3d5c'; }

function fmtTime(s) { const m=Math.floor(s/60); return m>0?`${m}:${String(s%60).padStart(2,'0')}`:String(s); }

function startTimer(secs) {
  if (timerIv) clearInterval(timerIv);
  timerTotal = timerLeft = secs; activePreset = secs;
  const ov = document.getElementById('timer-ov');
  const disp = document.getElementById('t-disp');
  const arc = document.getElementById('t-arc');
  const msg = document.getElementById('t-msg');

  msg.textContent = MOTIVATIONS[Math.floor(Math.random()*MOTIVATIONS.length)];
  document.querySelectorAll('.p-btn').forEach(b => {
    const map = {'45s':45,'1 min':60,'1:30':90,'2 min':120,'3 min':180};
    b.classList.toggle('active', map[b.textContent.trim()] === secs);
  });
  ov.classList.add('show');

  function tick() {
    const r = timerLeft / timerTotal;
    arc.style.strokeDashoffset = CIRC * (1 - r);
    arc.style.stroke = timerColor(r);
    disp.textContent = fmtTime(timerLeft);
    if (timerLeft <= 0) {
      clearInterval(timerIv); timerIv = null;
      beep();
      setTimeout(() => ov.classList.remove('show'), 800);
      return;
    }
    timerLeft--;
  }
  tick();
  timerIv = setInterval(tick, 1000);
}

function beep() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.2,.4].forEach(d => {
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; o.type='sine';
      g.gain.setValueAtTime(.3,ctx.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.25);
      o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+.25);
    });
  } catch(e){}
}

function skipTimer() { if(timerIv){clearInterval(timerIv);timerIv=null;} document.getElementById('timer-ov').classList.remove('show'); }
function addTime(s) { timerLeft=Math.min(timerLeft+s,600); timerTotal=Math.max(timerTotal,timerLeft); }
function setPreset(s) { startTimer(s); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════════════════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', theme === 'dark' ? '#07070e' : '#f4f4f8');
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  S.theme = next; save();
  applyTheme(next);
}

// ══════════════════════════════════════════════════════════════════
render();
applyTheme(S.theme || 'dark');

// ── PWA: Service Worker ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update().catch(()=>{});
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(() => {});

    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshed) return;
      refreshed = true;
      location.reload();
    });
  });
}

// ── PWA: Install prompt (Android "Add to Home Screen") ──
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <span>📲 Install the app for offline access</span>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button onclick="installApp()" style="background:var(--accent);border:none;border-radius:8px;padding:7px 14px;color:#07070e;font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:1px;cursor:pointer">INSTALL</button>
        <button onclick="dismissBanner()" style="background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--sub);cursor:pointer;font-size:.8rem">✕</button>
      </div>
    </div>`;
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--s3);border-top:1px solid var(--border2);padding:12px 16px;z-index:1000;font-size:.8rem;color:var(--text);font-family:Inter,sans-serif';
  document.body.appendChild(banner);
}

async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  dismissBanner();
  if (outcome === 'accepted') toast('✅ App installed! Find it on your home screen. 📱');
}

function dismissBanner() {
  const b = document.getElementById('install-banner');
  if (b) b.remove();
}
</script>
